<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B1D37">
<title>Судья — хронометраж</title>
<link rel="stylesheet" href="/assets/brand.css">
<style>
/* Экран судьи на финише: всегда тёмный (ночной синий ФЛАСО), под телефон 360–430 px. */
:root{color-scheme:dark;
  --j-ink:#fff;                 /* текст на тёмном */
  --j-soft:var(--night-muted);  /* вторичный текст */
  --j-ok:#3FBF73;               /* «на связи», завершённое время — светлее, чтобы читалось на синем */
  --j-gap:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--j-ink);font:16px/1.4 var(--body)}
body{min-height:100vh;display:flex;flex-direction:column}
button,select,input{font:inherit}
:focus{outline:none}
:focus-visible{outline:3px solid var(--start);outline-offset:2px}

/* шапка */
.top{border-bottom:3px solid var(--track);background:var(--night)}
.top-in{max-width:520px;margin:0 auto;padding:12px var(--j-gap);display:flex;gap:12px;align-items:center;justify-content:space-between}
.top .brand{display:block;height:30px;width:auto;flex:0 0 auto}
.top-r{display:flex;align-items:center;gap:10px;min-width:0}
.role{font-size:13px;color:var(--j-soft);white-space:nowrap}
.net{font:700 12px/1 var(--body);padding:6px 10px 6px 20px;border-radius:99px;background:rgba(63,191,115,.16);color:var(--j-ok);white-space:nowrap;position:relative;max-width:62vw;overflow:hidden;text-overflow:ellipsis}
.net::before{content:"";position:absolute;left:9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:currentColor}
.net.off{background:var(--track);color:#fff}
.top-r:has(.net.off) .role{display:none}   /* без связи важнее статус, чем подпись */

.wrap{width:100%;max-width:520px;margin:0 auto;padding:14px var(--j-gap) 24px;flex:1}
.evname{margin:0;font:600 22px/1.15 var(--head);letter-spacing:.2px;overflow-wrap:anywhere}

/* выбор соревнования / забега / устройства / судьи */
.sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
select,input{color:var(--j-ink);background:var(--night-2);border:1px solid var(--night-line);border-radius:var(--r);padding:10px 12px;width:100%;min-width:0;min-height:44px}
select{appearance:none;-webkit-appearance:none;padding-right:30px;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--j-soft) 50%),linear-gradient(135deg,var(--j-soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select option{background:var(--night-2);color:var(--j-ink)}
input::placeholder{color:var(--j-soft);opacity:1}
select:focus-visible,input:focus-visible{outline:2px solid var(--start);outline-offset:0;border-color:var(--start)}

/* документы */
.docs{background:var(--night-2);border:1px solid var(--night-line);border-radius:var(--r);margin-top:10px;padding:0 12px;font-size:15px}
.docs summary{cursor:pointer;font-weight:700;padding:11px 0;list-style-position:inside}
.docs summary span{color:var(--j-soft);font-weight:400}
.docs a{display:block;padding:10px 0;border-top:1px solid var(--night-line);color:var(--start);text-decoration:none}
.docs a:hover{text-decoration:underline}

/* секундомер */
.clockbox{margin-top:14px;padding:12px 0 4px;border-top:1px solid var(--night-line)}
.heatinfo{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;font:600 17px/1.25 var(--head);letter-spacing:.2px}
.heatinfo .small{font:400 14px/1.35 var(--body)}
.clock{font:600 clamp(60px,19vw,84px)/1 var(--head);font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin-top:6px;white-space:nowrap}
.clock.idle{color:var(--j-soft);font-size:34px;line-height:1.2;padding:8px 0 2px;letter-spacing:0}
.clock.done{color:var(--j-ok)}
.small{font-size:13px;color:var(--j-soft)}
#clockInfo{margin-top:4px}
.badge{font:700 12px/1 var(--body);letter-spacing:.2px;padding:5px 9px;border-radius:99px;background:var(--night-line);color:var(--j-ink)}
.badge.run{background:var(--track);color:#fff}
.badge.fin{background:#fff;color:var(--night)}

/* кнопки */
button{font-weight:700;border:1px solid var(--night-line);background:var(--night-2);color:var(--j-ink);border-radius:var(--r);padding:12px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--j-soft)}
.startbtn,.finbtn,.nextbox .go,.big{display:block;width:100%;font-family:var(--head);font-weight:600;letter-spacing:.6px;border:0}
.startbtn{margin-top:12px;background:var(--track);color:var(--track-ink);font-size:26px;padding:16px;min-height:64px}
.finbtn{margin-top:12px;background:#fff;color:var(--night);font-size:22px;padding:14px;min-height:58px}
.link{display:inline-block;background:none;border:0;color:var(--j-soft);text-decoration:underline;text-underline-offset:3px;font-weight:400;padding:10px 0;font-size:15px}
.link:hover{color:var(--j-ink)}

/* следующий забег */
.nextbox{border:1px dashed var(--night-line);border-radius:var(--r);padding:12px;margin-top:14px}
.nextbox .small{font:600 15px var(--head);letter-spacing:.3px;color:var(--j-ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.nextbox .go{margin-top:10px;background:var(--track);color:var(--track-ink);font-size:18px;padding:12px;min-height:52px}

/* режимы: ввод номера / отсечки */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:16px;background:var(--night-2);border:1px solid var(--night-line);border-radius:8px;padding:3px}
.modes button{border:0;background:none;color:var(--j-soft);font:600 16px/1 var(--head);letter-spacing:.3px;padding:12px 6px;border-radius:6px;min-height:44px}
.modes button.on{background:#fff;color:var(--night)}

/* табло ввода и клавиатура */
.display{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:#fff;color:var(--night);border-radius:8px;padding:8px 16px;margin-top:12px;min-height:76px;box-shadow:inset 0 0 0 3px transparent}
.display .num{font:600 52px/1.1 var(--head);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.display .num:empty::before{content:"номер";color:var(--muted);font:400 22px var(--body);letter-spacing:0}
.display .t{font:500 18px var(--head);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.display.armed{box-shadow:inset 0 0 0 3px var(--track)}
.display.armed .t{color:var(--track)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad button{font:600 30px/1 var(--head);padding:0;min-height:62px;border:0;background:var(--night-2);border-radius:8px}
.pad button:hover{background:#1A3460}
.pad .ok{background:var(--track);color:var(--track-ink);font-size:28px}
.pad .ok:hover{background:#C9151B}
.pad .del{color:var(--j-soft);font-size:26px}
.hint{margin-top:8px;line-height:1.4}
.big{margin-top:12px;background:var(--track);color:var(--track-ink);font-size:34px;padding:0;min-height:168px;border-radius:12px}

/* список отметок */
h3{font:600 15px/1.2 var(--head);letter-spacing:.6px;text-transform:uppercase;color:var(--j-soft);margin:22px 0 8px;display:flex;justify-content:space-between;gap:10px}
#cnt{text-transform:none;letter-spacing:.2px}
.list{background:var(--night-2);border:1px solid var(--night-line);border-radius:8px;overflow:hidden}
.item{display:grid;grid-template-columns:2em minmax(0,1fr) 5.6em 2.5em;gap:8px;align-items:center;padding:8px 6px 8px 12px;border-bottom:1px solid var(--night-line)}
.item:last-child{border-bottom:0}
.item .n{color:var(--j-soft);font:500 15px var(--head)}
.item .tm{font:500 20px/1.15 var(--head);font-variant-numeric:tabular-nums;min-width:0}
.item .tm .small{font:400 12px/1.3 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item input{padding:6px 6px;min-height:42px;font:600 20px var(--head);text-align:center;background:var(--night);color:#fff}
.item input.need{border-color:var(--start);background:rgba(243,72,29,.14)}
.item .st{font-size:16px;text-align:center;color:var(--j-soft)}
.item .x{background:none;border:0;color:var(--j-soft);padding:0;width:40px;height:40px;font-size:18px;font-weight:400;border-radius:var(--r)}
.item .x:hover{color:var(--track);background:rgba(231,30,37,.12)}
.empty{padding:18px;text-align:center;color:var(--j-soft)}

.hide{display:none!important}
.blocked{opacity:.4}

/* подвал с логотипами: Сахалин → ФЛАСО */
.foot{max-width:520px;width:100%;margin:0 auto;padding:18px var(--j-gap) 26px;border-top:1px solid var(--night-line)}
.foot .logos{gap:16px;opacity:.85}
.foot .lg-sakh{height:30px}
.foot .lg-flaso{height:28px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;max-width:calc(100% - 32px);background:#fff;color:var(--night);font-weight:700;padding:11px 16px;border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.35);border-left:4px solid var(--track);opacity:0;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion:no-preference){
  button:active{transform:scale(.97)}
  button{transition:background-color .12s,border-color .12s,color .12s}
  .toast{transition:opacity .2s}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <img class="brand" src="/assets/sakhstart-dark.svg" alt="SakhStart">
  <div class="top-r"><span class="role">Судья</span><span class="net" id="net">на связи</span></div>
</div></header>
<div class="wrap">
  <h1 class="evname" id="evName">Судья</h1>
  <div class="sel">
    <select id="evSel" aria-label="Соревнование"></select>
    <select id="waveSel" aria-label="Забег"></select>
    <select id="devSel" aria-label="Точка отметки"></select>
    <input id="judge" placeholder="Ваше имя (судья)" aria-label="Ваше имя (судья)">
  </div>

  <details class="docs hide" id="docs"><summary>📁 Документы для судей <span id="docsN"></span></summary><div id="docsList"></div></details>

  <div class="clockbox">
    <div class="heatinfo" id="heatInfo"></div>
    <div class="clock idle" id="clock">Старт не дан</div>
    <div class="small" id="clockInfo"></div>
    <button class="startbtn hide" id="btnStart">СТАРТ</button>
    <button class="finbtn hide" id="btnFinish">■ ФИНИШ ЗАБЕГА</button>
    <button class="link hide" id="btnReopen">открыть забег снова</button>
  </div>

  <div class="nextbox" id="nextBox">
    <div class="small" id="nextTitle">Следующий забег</div>
    <div class="row2">
      <input id="nextCat" list="cats" placeholder="Категория" aria-label="Категория">
      <input id="nextDist" list="dists" placeholder="Дистанция" aria-label="Дистанция">
    </div>
    <button class="go" id="btnNext">+ Создать следующий забег</button>
  </div>
  <datalist id="cats"><option>Мальчики до 12 лет<option>Девочки до 12 лет<option>Мальчики до 14 лет<option>Девочки до 14 лет<option>Юноши до 16 лет<option>Девушки до 16 лет<option>Юноши до 18 лет<option>Девушки до 18 лет<option>Юниоры до 20 лет<option>Юниорки до 20 лет<option>Мужчины до 23 лет<option>Женщины до 23 лет<option>Мужчины<option>Женщины<option>Ветераны</datalist>
  <datalist id="dists"><option>60 м<option>100 м<option>200 м<option>400 м<option>800 м<option>1000 м<option>1500 м<option>3000 м<option>5 км<option>10 км</datalist>

  <div class="modes">
    <button id="modeNum" class="on">Ввод номера</button>
    <button id="modeTap">Отсечки</button>
  </div>

  <div id="paneNum">
    <div class="display" id="disp"><span class="num" id="dispNum"></span><span class="t" id="dispTime"></span></div>
    <div class="pad" id="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button class="del" data-k="del" aria-label="Стереть">⌫</button><button>0</button><button class="ok" data-k="ok" aria-label="Записать">✓</button>
    </div>
    <div class="small hint">Время фиксируется в момент первого нажатия цифры. ✓ без номера — отсечка без номера.</div>
  </div>

  <div id="paneTap" class="hide">
    <button class="big" id="btnTap">⏱ ФИНИШ</button>
    <div class="small hint">Нажимайте на каждого финишировавшего по порядку, номера впишите ниже, когда будет время.</div>
  </div>

  <h3><span id="listTitle">Отметки</span><span id="cnt"></span></h3>
  <div class="list" id="list"></div>
</div>
<footer class="foot"><div class="logos">
  <img class="lg-sakh" src="/assets/sakhalin-light.png" alt="Сахалинская область">
  <img class="lg-flaso" src="/assets/flaso-dark.png" alt="ФЛАСО">
</div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const qs=new URLSearchParams(location.search);
let offset=LS.get("judge.offset",0), events=[], ev=null, online=true;
let queue=LS.get("judge.queue",[]);      // ещё не отправленные отметки
let marks=[];                              // отметки с сервера
let armedAt=null, typed="";

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800);}
function vibe(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
const nowMs=()=>Date.now()+offset;
function fmt(ms){const n=ms<0;ms=Math.abs(ms);const t=Math.floor(ms/100),h=Math.floor(t/36000),m=Math.floor(t%36000/600),s=Math.floor(t%600/10),d=t%10;
  return (n?"-":"")+h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+d;}
function clockOf(ms){const d=new Date(ms);return d.toLocaleTimeString("ru-RU",{hour12:false})+"."+Math.floor(d.getMilliseconds()/100);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,10);}
async function api(path,body){
  const o={headers:{"X-Requested-With":"timing-hub"}};
  if(body!==undefined){o.method="POST";o.headers["Content-Type"]="application/json";o.body=JSON.stringify(Object.assign({judge:$("judge").value.trim()},body));}
  const r=await fetch(path,o); const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(d.error||r.status);e.http=r.status;throw e;}
  return d;
}
function setNet(ok){online=ok;$("net").textContent=ok?(queue.length?`отправка… ${queue.length}`:"на связи"):`нет связи · в очереди ${queue.length}`;$("net").classList.toggle("off",!ok);}

/* ---- выбор забега ---- */
function heat(){ if(!ev) return null; const w=$("waveSel").value; return w?ev.waves.find(x=>x.name===w)||null:null; }
function startMs(){ if(!ev) return null; const h=heat(); return h?h.start_epoch_ms:(ev.waves.length?null:ev.start_epoch_ms); }
function finishMs(){ const h=heat(); return h?h.finish_epoch_ms:null; }
function heatState(){ const h=heat(); if(h) return h.state; if(!ev||ev.waves.length) return "none"; return ev.start_epoch_ms?"running":"planned"; }
function pickDefaultHeat(prev){
  if(!ev||!ev.waves.length) return "";
  if(prev&&ev.waves.some(w=>w.name===prev)) return prev;
  const run=ev.waves.filter(w=>w.state==="running"); if(run.length) return run[run.length-1].name;
  const plan=ev.waves.find(w=>w.state==="planned"); if(plan) return plan.name;
  return ev.waves[ev.waves.length-1].name;
}
async function loadEvents(){
  try{
    const c=await api("/api/clock"); offset=c.server_epoch_ms-Date.now(); LS.set("judge.offset",offset);
    const r=await api("/api/events"); events=r.events.filter(e=>!e.archived); setNet(true);
    LS.set("judge.events",events);
  }catch(e){ events=LS.get("judge.events",[]); setNet(false); }
  const want=+((ev&&ev.id)||qs.get("event")||LS.get("judge.event",0));
  ev=events.find(e=>e.id===want)||events.find(e=>e.status==="running")||events[0]||null;
  $("evSel").innerHTML=events.map(e=>`<option value="${e.id}" ${ev&&e.id===ev.id?"selected":""}>${esc(e.name)}</option>`).join("")||"<option>нет соревнований</option>";
  renderEv();
}
function heatLabel(w){return w.name+(w.category||w.distance?" — "+[w.category,w.distance].filter(Boolean).join(", "):"")+(w.state==="running"?" ▶":w.state==="finished"?" ✓":"");}
function renderEv(keep){
  $("evName").textContent=ev?ev.name:"Нет соревнований";
  const wPrev=keep!==undefined?keep:($("waveSel").value||LS.get("judge.wave",""));
  const hs=ev?ev.waves:[];
  $("waveSel").innerHTML=hs.length?hs.map(w=>`<option value="${esc(w.name)}">${esc(heatLabel(w))}</option>`).join(""):'<option value="">общий старт</option>';
  $("waveSel").value=pickDefaultHeat(wPrev); LS.set("judge.wave",$("waveSel").value);
  const devs=[]; if(ev&&ev.finish_device) devs.push(ev.finish_device); ["JUDGE"].forEach(d=>devs.includes(d)||devs.push(d));
  const dPrev=LS.get("judge.dev","");
  if(dPrev&&!devs.includes(dPrev)) devs.push(dPrev);
  $("devSel").innerHTML=devs.map(d=>`<option>${esc(d)}</option>`).join("");
  if(dPrev) $("devSel").value=dPrev;
  renderHeat(); loadMarks(); loadDocs();
}
async function loadDocs(){
  if(!ev){$("docs").classList.add("hide");return;}
  try{
    const r=await api(`/api/events/${ev.id}/files?folder=${encodeURIComponent("Для судей")}`);
    const fl=r.files.slice().reverse();
    $("docs").classList.remove("hide");
    $("docsN").textContent=fl.length?`(${fl.length})`:"";
    $("docsList").innerHTML=fl.map(f=>`<a href="/files/${f.id}" target="_blank">${esc(f.name)}</a>`).join("")+
      `<a href="/protocol?event=${ev.id}&kind=start" target="_blank">Стартовый протокол (для печати) ↗</a>`;
  }catch(e){}
}
function renderHeat(){
  const h=heat(), st=heatState();
  const lbl={planned:"ожидает старта",running:"идёт",finished:"завершён",none:"",}[st]||"";
  $("heatInfo").innerHTML=h?`<b>${esc(h.name)}</b>${h.category?" · "+esc(h.category):""}${h.distance?" · "+esc(h.distance):""} <span class="badge ${st==="running"?"run":st==="finished"?"fin":""}">${lbl}</span>`:(ev&&!ev.waves.length?'<span class="small">Забегов нет — общий старт или создайте забег ниже</span>':"");
  $("btnStart").classList.toggle("hide",!ev||!(st==="planned"));
  $("btnStart").textContent=h?`СТАРТ · ${h.name}`:"СТАРТ";
  $("btnFinish").classList.toggle("hide",!h||st!=="running");
  $("btnReopen").classList.toggle("hide",!h||st!=="finished");
  // форма следующего забега: категория/дистанция по умолчанию — как у текущего
  const last=ev&&ev.waves.length?ev.waves[ev.waves.length-1]:null;
  $("nextBox").classList.toggle("hide",!ev||st==="running"||st==="planned");   // во время забега не мешает клавиатуре
  const n=ev?ev.waves.length+1:1;
  $("nextTitle").textContent=ev&&ev.waves.length?`Следующий забег (Забег ${n})`:"Создать забег";
  if(!$("nextCat").matches(":focus")&&!$("nextCat").dataset.touched) $("nextCat").value=(last&&last.category)||"";
  if(!$("nextDist").matches(":focus")&&!$("nextDist").dataset.touched) $("nextDist").value=(last&&last.distance)||"";
  const blocked=!ev||st==="finished"||st==="planned";
  $("paneNum").classList.toggle("blocked",blocked); $("paneTap").classList.toggle("blocked",blocked);
}
$("evSel").onchange=e=>{ev=events.find(x=>x.id===+e.target.value);LS.set("judge.event",ev?ev.id:0);$("nextCat").dataset.touched=$("nextDist").dataset.touched="";renderEv("");};
$("waveSel").onchange=e=>{LS.set("judge.wave",e.target.value);typed="";armedAt=null;$("dispNum").textContent="";renderHeat();render();};
$("devSel").onchange=e=>LS.set("judge.dev",e.target.value);
["nextCat","nextDist"].forEach(id=>$(id).oninput=e=>e.target.dataset.touched="1");
$("judge").value=LS.get("judge.name","");
$("judge").onchange=e=>LS.set("judge.name",e.target.value.trim());

/* ---- часы, старт, финиш ---- */
function tick(){
  const s=startMs(), f=finishMs(), c=$("clock");
  if(s&&f){c.classList.remove("idle");c.classList.add("done");c.textContent=fmt(f-s);$("clockInfo").textContent="забег завершён · время остановлено";}
  else if(s){c.classList.remove("idle","done");c.textContent=fmt(nowMs()-s);$("clockInfo").textContent="время с начала забега";}
  else{c.classList.add("idle");c.classList.remove("done");c.textContent=ev?"Старт не дан":"—";$("clockInfo").textContent=ev?"секундомер запустится по старту":"";}
  if(armedAt){$("dispTime").textContent=s?fmt(armedAt-s):clockOf(armedAt);}
}
async function refreshAfter(name){await loadEvents();if(name!==undefined){$("waveSel").value=name;LS.set("judge.wave",name);renderHeat();render();}}
$("btnStart").onclick=async()=>{
  if(!ev)return; const h=heat(), t=nowMs();
  const others=ev.heats_sequential&&h?ev.waves.filter(w=>w.state==="running"&&w.name!==h.name).map(w=>w.name):[];
  if(!confirm(`Дать СТАРТ${h?" «"+h.name+"»":""}?`+(others.length?`\n\n${others.join(", ")} будет автоматически завершён.`:"")))return;
  try{await api(`/api/events/${ev.id}/start`,h?{wave:h.name,epoch_ms:t}:{epoch_ms:t});vibe(200);await refreshAfter(h?h.name:undefined);toast("Старт!");}
  catch(e){toast("Ошибка старта: "+e.message);}
};
$("btnFinish").onclick=async()=>{
  const h=heat(); if(!h)return; const t=nowMs();
  const pend=queue.filter(q=>q.event_id===ev.id&&q.wave===h.name).length;
  if(!confirm(`ФИНИШ забега «${h.name}»?\nСекундомер остановится, отметки после этого момента не учитываются.`+(pend?`\n\nВ очереди ещё ${pend} отметок — они отправятся.`:"")))return;
  try{await api(`/api/events/${ev.id}/waves`,{name:h.name,finish:true,epoch_ms:t});vibe([60,60,200]);await refreshAfter(h.name);toast("Забег завершён");}
  catch(e){toast("Ошибка: "+e.message);}
};
$("btnReopen").onclick=async()=>{
  const h=heat(); if(!h||!confirm(`Открыть «${h.name}» снова? Секундомер продолжит идти.`))return;
  try{await api(`/api/events/${ev.id}/waves`,{name:h.name,reopen:true});await refreshAfter(h.name);}catch(e){toast("Ошибка: "+e.message);}
};
$("btnNext").onclick=async()=>{
  if(!ev)return;
  try{const r=await api(`/api/events/${ev.id}/waves`,{next:true,category:$("nextCat").value.trim(),distance:$("nextDist").value.trim()});
    $("nextCat").dataset.touched=$("nextDist").dataset.touched="";
    await refreshAfter(r.created);toast(`${r.created} создан — можно давать старт`);}
  catch(e){toast("Ошибка: "+e.message);}
};

/* ---- режимы ---- */
function mode(m){LS.set("judge.mode",m);$("modeNum").classList.toggle("on",m==="num");$("modeTap").classList.toggle("on",m==="tap");
  $("paneNum").classList.toggle("hide",m!=="num");$("paneTap").classList.toggle("hide",m!=="tap");}
$("modeNum").onclick=()=>mode("num"); $("modeTap").onclick=()=>mode("tap"); mode(LS.get("judge.mode","num"));

/* ---- создание отметок (сначала в очередь, потом на сервер) ---- */
function addMark(bib,epoch){
  if(!ev)return toast("Нет соревнования");
  const st=heatState();
  if(st==="planned")return toast("Сначала дайте СТАРТ");
  if(st==="finished")return toast("Забег завершён — создайте или выберите следующий");
  const m={client_id:uid(),event_id:ev.id,bib:bib||"",device:$("devSel").value,epoch_ms:epoch,wave:$("waveSel").value||""};
  queue.push(m);LS.set("judge.queue",queue);vibe(bib?40:80);
  render();flush();
}
$("pad").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const k=b.dataset.k||b.textContent.trim();
  if(k==="del"){typed=typed.slice(0,-1);if(!typed)armedAt=null;}
  else if(k==="ok"){addMark(typed,armedAt||nowMs());typed="";armedAt=null;$("dispTime").textContent="";}
  else{if(!typed&&!armedAt)armedAt=nowMs();if(typed.length<6)typed+=k;}
  $("dispNum").textContent=typed;$("disp").classList.toggle("armed",!!armedAt);
  if(!armedAt)$("dispTime").textContent="";
};
$("btnTap").onclick=()=>addMark("",nowMs());

let flushing=false;
async function flush(){
  if(flushing||!queue.length)return; flushing=true;
  try{
    while(queue.length){
      const m=queue[0];
      try{await api(`/api/events/${m.event_id}/manual`,{bib:m.bib,device:m.device,epoch_ms:m.epoch_ms,client_id:m.client_id,wave:m.wave||""});}
      catch(e){if(e.http&&e.http>=400&&e.http<500&&e.http!==401){toast("Отклонено: "+e.message);}else throw e;}
      queue.shift();LS.set("judge.queue",queue);
    }
    setNet(true);await loadMarks();
  }catch(e){setNet(false);}
  finally{flushing=false;render();}
}
async function loadMarks(){
  if(!ev)return;
  try{const r=await api(`/api/events/${ev.id}/manual`);marks=r.marks;setNet(true);}catch(e){setNet(false);}
  render();
}

/* ---- список ---- */
function render(){
  if(!ev){$("list").innerHTML='<div class="empty">—</div>';return;}
  const s0=startMs(), h=heat(), hn=h?h.name:"";
  const mine=x=>!hn||(x.wave?x.wave===hn:(h.start_epoch_ms&&x.ms>=h.start_epoch_ms&&(!h.finish_epoch_ms||x.ms<=h.finish_epoch_ms+2000)));
  $("listTitle").textContent=hn?`Отметки · ${hn}`:"Отметки";
  const srv=marks.map(m=>({id:m.id,bib:m.bib,device:m.device,ms:m.epoch_ms,sent:true,judge:m.judge,wave:m.wave})).filter(mine);
  const loc=queue.filter(q=>q.event_id===ev.id).map(q=>({cid:q.client_id,bib:q.bib,device:q.device,ms:q.epoch_ms,sent:false,wave:q.wave})).filter(mine);
  const all=srv.concat(loc).sort((a,b)=>a.ms-b.ms);
  const pend=all.filter(x=>!x.bib).length;
  $("cnt").textContent=`${all.length}${pend?` · без номера ${pend}`:""}`;
  $("list").innerHTML=all.slice().reverse().map((x,i)=>`
    <div class="item" data-id="${x.id||""}" data-cid="${x.cid||""}">
      <span class="n">${all.length-i}</span>
      <span class="tm">${s0?fmt(x.ms-s0):clockOf(x.ms)}<div class="small">${esc(x.device)}${x.judge?" · "+esc(x.judge):""}</div></span>
      <input value="${esc(x.bib)}" placeholder="№" inputmode="numeric" class="${x.bib?"":"need"}">
      <span class="st">${x.sent?'<button class="x" data-del="1">✕</button>':"⏳"}</span>
    </div>`).join("")||'<div class="empty">Отметок пока нет</div>';
}
$("list").addEventListener("change",async e=>{
  const it=e.target.closest(".item");if(!it||e.target.tagName!=="INPUT")return;
  const bib=e.target.value.trim();
  if(it.dataset.cid){const q=queue.find(q=>q.client_id===it.dataset.cid);if(q){q.bib=bib;LS.set("judge.queue",queue);}render();return;}
  try{await api(`/api/events/${ev.id}/manual/${it.dataset.id}`,{bib});vibe(30);await loadMarks();}catch(err){toast("Не сохранено: "+err.message);}
});
$("list").addEventListener("click",async e=>{
  if(!e.target.dataset.del)return;
  const it=e.target.closest(".item");if(!confirm("Удалить отметку?"))return;
  try{await api(`/api/events/${ev.id}/manual/${it.dataset.id}`,{delete:true});await loadMarks();}catch(err){toast("Ошибка: "+err.message);}
});

loadEvents();
setInterval(tick,100);
setInterval(flush,2000);
setInterval(()=>{if(!queue.length)loadMarks();},5000);
setInterval(()=>loadEvents(),10000);
</script>
</body>
</html>
