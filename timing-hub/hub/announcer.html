<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Экран диктора</title>
<style>
:root{--bg:#0d0f11;--ink:#f2f3f4;--muted:#8b939a;--accent:#e8603f;--line:#23282d;--panel:#16191c;--mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{display:grid;grid-template-rows:auto auto 1fr auto;height:100%;padding:2.5vh 3vw;gap:2vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.name{font-size:clamp(18px,2.6vw,34px);font-weight:700}
.clock{font:700 clamp(28px,4.5vw,60px) var(--mono);color:var(--muted)}
.hero{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:2vh 3vw;display:grid;grid-template-columns:auto 1fr auto;gap:3vw;align-items:center}
.hero.new{animation:pulse 2.5s ease-out}
@keyframes pulse{from{border-color:var(--accent);box-shadow:0 0 0 8px rgba(232,96,63,.35)}to{}}
.hero .place{font:800 clamp(40px,7vw,110px)/1 var(--mono);color:var(--accent)}
.hero .bib{font:800 clamp(70px,13vw,200px)/1 var(--mono)}
.hero .meta{color:var(--muted);font-size:clamp(14px,1.8vw,26px)}
.hero .time{font:700 clamp(36px,6vw,96px) var(--mono);text-align:right}
.label{font-size:clamp(12px,1.3vw,18px);color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.list{overflow:hidden}
.r{display:grid;grid-template-columns:3em 5em 1fr auto;gap:1.5vw;align-items:baseline;padding:.7vh 0;border-bottom:1px solid var(--line);font-size:clamp(20px,2.8vw,40px)}
.r .p{color:var(--muted);font-family:var(--mono)} .r .b{font-weight:800;font-family:var(--mono)} .r .w{color:var(--muted);font-size:.6em} .r .t{font-family:var(--mono)}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.empty{color:var(--muted);font-size:clamp(20px,3vw,40px);text-align:center;padding:4vh}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="name" id="name">Экран диктора</div><div class="clock" id="clock">—</div></div>
  <div>
    <div class="label" style="margin-bottom:1vh">Только что финишировал</div>
    <div class="hero" id="hero"><div class="empty" style="grid-column:1/-1">ждём первого финишёра…</div></div>
  </div>
  <div class="list"><div class="label" style="margin-bottom:1vh">Перед ним</div><div id="list"></div></div>
  <div class="foot"><span id="stat"></span><span><button id="snd">🔔 звук: вкл</button> · F11 — во весь экран</span></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eid=new URLSearchParams(location.search).get("event");
let offset=0,startMs=null,lastKey=null,sound=true,actx=null;
function fmt(ms){const n=ms<0;ms=Math.abs(ms);const t=Math.floor(ms/100),h=Math.floor(t/36000),m=Math.floor(t%36000/600),s=Math.floor(t%600/10),d=t%10;
  return (n?"-":"")+h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+d;}
function beep(){if(!sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
  [880,1320].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime+i*.12;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.start(t);o.stop(t+.12);});}catch(e){}}
$("snd").onclick=()=>{sound=!sound;$("snd").textContent="🔔 звук: "+(sound?"вкл":"выкл");beep();};
async function get(p){const r=await fetch(p,{headers:{"X-Requested-With":"timing-hub"}});if(!r.ok)throw new Error(r.status);return r.json();}
async function sync(){try{const c=await get("/api/clock");offset=c.server_epoch_ms-Date.now();}catch(e){}}
async function load(){
  if(!eid){$("name").textContent="Не выбрано соревнование (откройте из интерфейса)";return;}
  try{
    const r=await get(`/api/events/${encodeURIComponent(eid)}/results`);
    const ev=r.event; startMs=ev.start_epoch_ms; $("name").textContent=ev.name;
    const fin=r.finished.slice().sort((a,b)=>b.finish_epoch_ms-a.finish_epoch_ms);
    $("stat").textContent=`финишировали ${r.finished.length} · на трассе ${r.on_course.length}`;
    if(!fin.length)return;
    const h=fin[0], key=h.bib+"|"+h.finish_epoch_ms;
    const wave=h.wave?`<div class="meta">${esc(h.wave)}</div>`:"";
    $("hero").innerHTML=`<div class="place">${h.place}</div><div><div class="bib">${esc(h.bib||"?")}</div>${wave}</div><div class="time">${esc(h.time)}</div>`;
    if(lastKey&&key!==lastKey){$("hero").classList.remove("new");void $("hero").offsetWidth;$("hero").classList.add("new");beep();}
    lastKey=key;
    $("list").innerHTML=fin.slice(1,9).map(x=>`<div class="r"><span class="p">${x.place}</span><span class="b">${esc(x.bib||"?")}</span><span class="w">${esc(x.wave||"")}</span><span class="t">${esc(x.time)}</span></div>`).join("");
  }catch(e){$("stat").textContent="нет связи с сервером…";}
}
function tick(){$("clock").textContent=startMs?fmt(Date.now()+offset-startMs):"старт не дан";}
sync();load();setInterval(tick,100);setInterval(load,1000);setInterval(sync,60000);
</script>
</body>
</html>
