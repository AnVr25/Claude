<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Протокол результатов</title>
<script>
/* Публичный режим — /r/<slug>/protocol на reg.fla65.ru: наружу открыт только /r/…, поэтому и ресурсы — из /r/assets/ */
window.PUB=/^\/r\/([A-Za-z0-9]{4,20})\/protocol\/?$/.exec(location.pathname);
window.ASSETS=window.PUB?"/r/assets/":"/assets/";
document.write('<link rel="stylesheet" href="'+window.ASSETS+'brand.css">');
</script>
<style>
/* Протокол — официальный документ: всегда светлый лист, чёрный текст, печать на A4. */
@page{size:A4;margin:12mm 12mm 14mm 12mm}
:root{color-scheme:light;
  --pr-bg:#E4E9F0;--pr-paper:#fff;--pr-ink:#0E1626;--pr-navy:#0B1D37;--pr-muted:#5E6B80;
  --pr-line:#CDD5E0;--pr-line-2:#B3BFCF;--pr-th:#EDF1F6;--pr-zebra:#F8FAFC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pr-bg);color:var(--pr-ink)}
body{font:12.5px/1.38 var(--body);-webkit-font-smoothing:antialiased}

/* Панель управления (только на экране) */
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:#0B1D37;color:#fff;font:14px/1.2 var(--body);border-bottom:3px solid var(--track);color-scheme:dark}
.bar .lg-ss{display:block;height:28px;width:auto;margin-right:4px}
.bar #barName{font:500 16px/1.2 var(--head);letter-spacing:.01em;max-width:28ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar select,.bar button,.bar a{font:inherit;min-height:34px;padding:6px 12px;border-radius:var(--r);border:1px solid #2C4166;background:#13284A;color:#fff;text-decoration:none;cursor:pointer}
.bar select{max-width:100%}
.bar a:hover,.bar select:hover{border-color:#9FB0C8}
.bar button.primary{background:var(--track);border-color:var(--track);color:#fff;font-weight:700}
.bar button.primary:hover{filter:brightness(1.08)}
.bar label{display:flex;gap:6px;align-items:center;color:#D5DEEA;cursor:pointer}
.bar input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--start)}
.bar .sp{flex:1}
.bar.off>:not(.lg-ss):not(.back):not(#barName){display:none}
:focus-visible{outline:2px solid var(--start);outline-offset:2px}

/* Лист A4 */
.sheet{width:210mm;min-height:297mm;margin:18px auto 28px;background:var(--pr-paper);padding:12mm 12mm 14mm;box-shadow:0 1px 2px rgba(11,29,55,.08),0 8px 28px rgba(11,29,55,.14);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}

/* Шапка: Сахалин → ФЛАСО → SakhStart */
.brandrow{position:relative;display:flex;align-items:center;gap:14px;padding-bottom:3mm;border-bottom:1.5px solid var(--pr-navy)}
.brandrow::after{content:"";position:absolute;left:0;bottom:-1.5px;width:30mm;height:3px;background:var(--track)}
.brandrow .logos{gap:14px}
.brandrow .lg-sakh{height:40px}
.brandrow .lg-flaso{height:34px}
.brandrow .lg-sep{background:var(--pr-line);height:30px}
.brandrow .lg-ss{display:block;margin-left:auto;height:34px;width:auto}
.org{margin-top:3mm;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--pr-muted)}
h1{margin:2mm 0 .5mm;text-align:center;font:600 22px/1.15 var(--head);letter-spacing:.09em;color:var(--pr-navy)}
.org+h1{margin-top:1.5mm}
.ev{text-align:center;font:500 17px/1.25 var(--head);margin:0 0 2.5mm;color:var(--pr-ink)}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 14px;border-top:1px solid var(--pr-line-2);border-bottom:1px solid var(--pr-line-2);padding:1.5mm 0;margin-bottom:2mm;font-size:12px;color:var(--pr-muted)}
.meta b{color:var(--pr-ink);font-weight:700}

/* Группы и таблицы */
h2{margin:4mm 0 1.5mm;padding-left:8px;border-left:3px solid var(--track);font:600 15px/1.2 var(--head);letter-spacing:.01em;color:var(--pr-navy);break-after:avoid;page-break-after:avoid}
h2 small{font:400 12px var(--body);color:var(--pr-muted);letter-spacing:0}
table{width:100%;border-collapse:collapse;margin-bottom:2mm}
th,td{border:1px solid var(--pr-line);padding:2px 4px;text-align:left;vertical-align:baseline}
th{font:500 11px/1.2 var(--head);letter-spacing:.02em;text-align:center;vertical-align:bottom;background:var(--pr-th);color:var(--pr-navy);border-color:var(--pr-line-2);border-bottom:1.5px solid var(--pr-navy)}
/* стартовый протокол: шире колонка «Фамилия, имя» (ширины команды/тренера заданы в разметке) */
th[style="width:26%"]{width:21%!important}
th[style="width:20%"]{width:17%!important}
tbody tr:nth-child(even) td{background:var(--pr-zebra)}
td.c{text-align:center}
td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--head);font-size:13px}
td.r b{font-weight:600}
td small{color:var(--pr-muted)}
tbody td:first-child b{font:600 13px/1 var(--head)}
/* 1–3 места: мягкие золото / серебро / бронза */
tr[class^="pl"]>td:first-child b{display:inline-block;min-width:22px;padding:3px 4px 2px;border-radius:999px;text-align:center}
tr.pl1>td:first-child b{background:#C9A22733;box-shadow:inset 0 0 0 1px var(--gold);color:#5C4708}
tr.mine>td{background:#F3481D17;font-weight:700}
tr.pl2>td:first-child b{background:#8E99A830;box-shadow:inset 0 0 0 1px var(--silver);color:#39414C}
tr.pl3>td:first-child b{background:#B873332E;box-shadow:inset 0 0 0 1px var(--bronze);color:#5B3613}
tr{break-inside:avoid;page-break-inside:avoid}
thead{display:table-header-group}
.note{margin-top:2mm;font-size:11px;color:var(--pr-muted)}
/* хвост листа: примечание, подписи и колонтитул не отрываются от таблицы и друг от друга */
.tail{break-inside:avoid;page-break-inside:avoid}

/* Подписи */
.sign{margin-top:6mm;display:grid;grid-template-columns:auto 1fr auto;column-gap:12px;row-gap:7mm;align-items:end;font-size:12.5px;break-inside:avoid;page-break-inside:avoid;max-width:150mm}
.sign .u{border-bottom:1px solid var(--pr-ink);height:1px;min-width:120px}
.sign .nm{min-width:150px}
.foot{margin-top:4mm;padding-top:1.5mm;border-top:1px solid var(--pr-line);font-size:10px;color:var(--pr-muted);display:flex;justify-content:space-between;gap:12px}
.empty{padding:30px;text-align:center;color:var(--pr-muted)}
.empty b{display:block;font:600 18px/1.25 var(--head);color:var(--pr-navy);margin-bottom:4px}
.empty a{color:var(--pr-navy)}
/* публичный режим: ссылка на страницу события, отметка «предварительные / официальные» */
.bar a.back{border-color:transparent;background:transparent;padding-left:4px;padding-right:4px;color:#D5DEEA}
.bar a.back:hover{color:#fff;border-color:transparent;text-decoration:underline}
.stamp{display:flex;align-items:center;justify-content:center;text-align:center;flex-wrap:wrap;gap:4px 8px;margin:-1mm 0 3mm;font:500 13px/1.3 var(--head);letter-spacing:.03em;color:var(--pr-navy)}
.stamp.pre{color:#B4330F}
.stamp.pre::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--start)}
.stamp.live::before{background:var(--track);animation:pulse 1.6s ease-out infinite}
.stamp small{font:400 12px var(--body);letter-spacing:0;color:var(--pr-muted)}
.stamp .po{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(231,30,37,.6)}70%{box-shadow:0 0 0 7px rgba(231,30,37,0)}100%{box-shadow:0 0 0 0 rgba(231,30,37,0)}}
@media (prefers-reduced-motion:reduce){.stamp.live::before{animation:none}}

.sheet.land{width:297mm;min-height:210mm}
.hide{display:none!important}
.cartmode .bar select,.cartmode .bar label,.cartmode #csv{display:none}
.ptabs{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;max-width:297mm;margin:12px auto 0;padding:0 16px;box-sizing:border-box}
.ptabs[hidden]{display:none}
.ptabs .tl{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.ptabs .tl button{font:600 14px/1.2 var(--body);min-height:40px;padding:8px 14px;border-radius:var(--r);border:1px solid #C9D2DE;background:#fff;color:#0B1D37;cursor:pointer}
.ptabs .tl button i{font-style:normal;font-weight:700;margin-left:8px;padding:1px 7px;border-radius:999px;background:#EEF2F7;color:#3B4452;font-size:12px}
.ptabs .tl button.on{background:#0B1D37;border-color:#0B1D37;color:#fff}.ptabs .tl button.on i{background:var(--track);color:#fff}
.ptabs .tl button:focus-visible,.ptabs .cartadd:focus-visible{outline:3px solid var(--start);outline-offset:2px}
.ptabs .cartadd{font:700 14px/1.2 var(--body);min-height:40px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--track);background:#fff;color:var(--track);cursor:pointer;margin-left:auto}
.ptabs .cartadd:hover{background:var(--track);color:#fff}
.ptabs .cartmsg{flex-basis:100%;font:13px var(--body);color:#1E7B3A;text-align:right;min-height:0}
.ptabs .cartmsg:empty{display:none}
@media print{.ptabs{display:none!important}}
@media (max-width:820px){.ptabs{padding:0 8px}.ptabs .cartadd{margin-left:0;width:100%}}
.embed .bar{display:none}.embed .sheet{margin:0 auto;box-shadow:none}
.att.tf td.cellv{min-width:12mm;height:8mm;font-size:12px;border-left:1px solid var(--pr-line-2)}.att.tf td.bestv{font-weight:700;background:rgba(0,0,0,.05)}
.cp{margin:0}.cp+.cp{margin-top:18mm;border-top:2px dashed var(--pr-line-2);padding-top:10mm}
@media print{.cp+.cp{margin-top:0;border-top:0;padding-top:0}}
.att th,.att td,.swt th.swh{padding:3px 2px}
.swt td.sw{height:8mm;border-left:1px solid var(--pr-line-2)}
.att th.sub{white-space:normal;line-height:1.1}
table.att,table.swt{table-layout:auto}
.att td.cell{height:8mm;min-width:10mm;border-left:1px solid var(--pr-line-2)}
.att th.sub{font-weight:600;font-size:10px;padding:2px 0;text-align:center}
.att td.big{height:8mm}
/* альбомный лист: подписи главного судьи и секретаря в одну строку */
.cp.land .sign,.sheet.land .sign{grid-template-columns:auto 1fr auto auto 1fr auto;max-width:none;column-gap:10px}
@media print{
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cp.fit{zoom:var(--z,1)}
  .sign,.tail,table{page-break-inside:auto}
  .sign,.tail{break-inside:avoid;page-break-inside:avoid}
  h2{margin-top:3mm}
  :root{--pr-ink:#000;--pr-muted:#3B4452;--pr-line:#B9C3D0;--pr-line-2:#9AA7B8}
  html,body{background:#fff;color:#000}
  .bar{display:none}
  .stamp .so{display:none}.stamp .po{display:inline}.stamp::before{display:none}
  .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  .sheet,.meta b,.ev,td,.sign{color:#000}
  .brandrow,.org,h1,.ev,.meta{break-inside:avoid;page-break-inside:avoid}
  .brandrow+*{break-before:avoid}
  a{color:inherit;text-decoration:none}
}
@media (max-width:820px){.sheet{width:auto;min-height:0;margin:8px;padding:16px;overflow-x:auto}.brandrow,.brandrow .logos{gap:10px}.brandrow .lg-sakh{height:32px}.brandrow .lg-flaso{height:26px}.brandrow .lg-sep{height:24px}.brandrow .lg-ss{height:30px}}
</style>
</head>
<body>
<div class="bar">
  <img class="lg-ss" id="barLogo" alt="SakhStart">
  <b id="barName">Протокол</b>
  <select id="mode">
    <option value="overall">Итоговый: общий рейтинг по категориям</option>
    <option value="heats">По забегам</option>
    <option value="teams">Командный зачёт</option>
    <option value="start">Стартовый протокол</option>
  </select>
  <select id="smode" class="hide" title="Как построить стартовый протокол" aria-label="Режим стартового протокола">
    <option value="heats">По забегам / группам</option>
    <option value="list">Общим списком</option>
  </select>
  <select id="orient" class="hide" title="Ориентация печатной формы" aria-label="Ориентация листа">
    <option value="portrait">Вертикальный лист</option>
    <option value="landscape">Горизонтальный лист</option>
  </select>
  <select id="sexf" class="hide" hidden title="Показать только мальчиков (юношей, мужчин) или только девочек (девушек, женщин)" aria-label="Пол">
    <option value="">все: мальчики и девочки</option>
    <option value="М">только мальчики / юноши / мужчины</option>
    <option value="Ж">только девочки / девушки / женщины</option>
  </select>
  <select id="grp" class="hide" hidden><option value="">все дистанции и категории</option></select>
  <select id="team" title="Показать только участников одной команды — например, своей школы"><option value="">все команды</option></select>
  <label id="chipBox"><input type="checkbox" id="showChip"> чипы</label>
  <label><input type="checkbox" id="showSplits"> отсечки</label>
  <label><input type="checkbox" id="showDnf" checked> не финишировали</label>
  <label><input type="checkbox" id="showCoach" checked> тренеры</label>
  <span class="sp"></span>
  <a id="csv">CSV</a>
  <button class="primary" onclick="window.print()">Печать / PDF</button>
</div>
<div class="ptabs" id="ptabs" hidden></div>
<div class="sheet" id="sheet"><div class="empty">Загрузка…</div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eid=new URLSearchParams(location.search).get("event");
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let R=null, SL=null;
const kind=new URLSearchParams(location.search).get("kind");
if(kind==="cart") document.body.classList.add("cartmode");
if(new URLSearchParams(location.search).get("embed")) document.body.classList.add("embed");
let DIST=new URLSearchParams(location.search).get("dist")||"";      // дисциплина целиком (мастер протоколов)
const QGRP=new URLSearchParams(location.search).get("grp")||"", HASGRP=new URLSearchParams(location.search).has("grp");
const QIDS=(new URLSearchParams(location.search).get("ids")||"").split(",").filter(Boolean);
const QTEAM=new URLSearchParams(location.search).get("team")||"";
["mode","smode","orient","sexf","grp","team","showChip","showSplits","showDnf","showCoach"].forEach(id=>{
  const el=$(id), saved=LS.get("protocol."+id,null);
  if(saved!==null){ if(el.type==="checkbox") el.checked=saved; else if(id!=="grp"&&id!=="team") el.value=saved; }
  el.onchange=()=>{LS.set("protocol."+id, el.type==="checkbox"?el.checked:el.value); render();};
});
{const q=new URLSearchParams(location.search); ["smode","orient","sexf","mode"].forEach(k=>{const v=q.get(k); if(v!==null&&[...$(k).options].some(o=>o.value===v)) $(k).value=v;});}
const dateRu=d=>{ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${dd}.${m}.${y}`; };
const PUB=window.PUB, SLUG=PUB?PUB[1]:"", A=window.ASSETS||"/assets/";
$("barLogo").src=A+"sakhstart-dark.svg";
const BRAND=`<div class="brandrow"><span class="logos"><img class="lg-sakh" src="${A}sakhalin-dark.png" alt="Сахалин"><span class="lg-sep"></span><img class="lg-flaso" src="${A}flaso-light.png" alt="ФЛАСО"></span><img class="lg-ss" src="${A}sakhstart.svg" alt="SakhStart"></div>`;
if(PUB){
  // публичный протокол: без чипов, без CSV из закрытого API, со ссылкой на страницу события
  $("csv").remove(); $("chipBox").remove();
  const b=document.createElement("a"); b.className="back"; b.href="/r/"+SLUG; b.textContent="← к странице события"; $("barLogo").after(b);
}
const gkey=x=>(x.distance||"")+"|"+(x.category||"");
// команды для выбора «показать только свою»; режим «Командный зачёт» — только если он считается
function fillTeams(){
  const all=R?R.finished.concat(R.on_course,R.not_seen):[];
  const teams=[...new Set(all.map(x=>x.team).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ru",{numeric:true}));
  const prev=QTEAM||LS.get("protocol.team","");
  $("team").innerHTML='<option value="">все команды</option>'+teams.map(t=>`<option>${esc(t)}</option>`).join("");
  $("team").hidden=teams.length<2;
  if(teams.includes(prev)) $("team").value=prev;
  const to=[...$("mode").options].find(o=>o.value==="teams");
  to.hidden=to.disabled=!(R&&R.teams&&R.teams.length);
  if(to.disabled&&$("mode").value==="teams") $("mode").value="overall";
}
const gtitle=(dist,cat)=>[dist,cat].filter(Boolean).join(" · ")||"Все участники";

async function load(){
  if(PUB) return loadPublic();
  if(!eid){$("sheet").innerHTML='<div class="empty">Не выбрано соревнование. Откройте протокол из интерфейса.</div>';return;}
  const r=await fetch(`/api/events/${encodeURIComponent(eid)}/results`,{headers:{"X-Requested-With":"timing-hub"}});
  if(!r.ok){$("sheet").innerHTML='<div class="empty">Не удалось загрузить результаты</div>';return;}
  R=await r.json();
  document.title="Протокол — "+R.event.name;
  $("barName").textContent=R.event.name;
  $("csv").href=`/api/events/${R.event.id}/results.csv`;
  const keys=[...new Set(R.finished.concat(R.on_course,R.not_seen).map(gkey))].sort();
  const prev=LS.get("protocol.grp","");
  $("grp").innerHTML='<option value="">все дистанции и категории</option>'+keys.map(k=>{const [d,c]=k.split("|");return `<option value="${esc(k)}">${esc(gtitle(d,c))}</option>`;}).join("");
  if(keys.includes(prev)) $("grp").value=prev;
  if(HASGRP) $("grp").value=keys.includes(QGRP)?QGRP:"";
  if(kind==="start") $("mode").value="start";
  else if(kind==="results"&&$("mode").value==="start") $("mode").value="overall";
  fillTeams(); if(kind==="teams"&&R.teams&&R.teams.length) $("mode").value="teams";
  render();
}
// состав эстафетной команды — мелко под названием
const mem=x=>x&&x.members?`<div style="font-size:10px;color:#555;line-height:1.3">${esc(x.members)}</div>`:"";
async function getPub(name){
  const r=await fetch(`/r/${SLUG}/${name}`,{cache:"no-store"});
  if(!r.ok){ r.text().catch(()=>{}); if(r.status===404||r.status===403) return null; throw new Error("HTTP "+r.status); }
  const d=await r.json();
  if(d.finished||d.not_seen){ ["finished","on_course","not_seen","devices"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; }); }
  if(d.event&&!Array.isArray(d.event.waves)) d.event.waves=[];
  return d;
}
function pubEmpty(title,text){
  $("sheet").innerHTML=`${BRAND}<div class="empty"><b>${esc(title)}</b>${esc(text)}<br><br><a href="/r/${esc(SLUG)}">← к странице события</a></div>`;
  document.querySelector(".bar").classList.add("off");
}
async function loadPublic(){
  try{ [R,SL]=await Promise.all([getPub("results.json"),getPub("startlist.json")]); }
  catch(e){ return pubEmpty("Не удалось загрузить протокол","Проверьте интернет и обновите страницу."); }
  if(!R&&!SL) return pubEmpty("Протокол ещё не опубликован","Он появится здесь, когда секретарь соревнований его опубликует.");
  const ev=(R||SL).event;
  document.title=(R?"Протокол — ":"Стартовый протокол — ")+ev.name;
  $("barName").textContent=ev.name;
  [...$("mode").options].forEach(o=>{ o.hidden=o.disabled=o.value==="start"?!SL:!R; });
  fillTeams();
  const keys=[...new Set(R?R.finished.concat(R.on_course,R.not_seen).map(gkey):SL.heats.map(gkey))].sort();
  const prev=LS.get("protocol.grp","");
  $("grp").innerHTML='<option value="">все дистанции и категории</option>'+keys.map(k=>{const [d,c]=k.split("|");return `<option value="${esc(k)}">${esc(gtitle(d,c))}</option>`;}).join("");
  if(keys.includes(prev)) $("grp").value=prev;
  if(kind==="start"&&SL||!R) $("mode").value="start";
  else if(kind==="teams"&&R.teams&&R.teams.length) $("mode").value="teams";
  else if($("mode").value==="start"||$("mode").selectedIndex<0) $("mode").value="overall";
  render();
  setInterval(refresh,15000);
}
// предварительные результаты во время старта — обновляем каждые 15 с

  const starts=ev.waves.filter(w=>w.start_time).map(w=>w.start_time.slice(11,16));
  const startTxt=ev.start_clock||(starts.length?starts[0]:(ev.start_time?ev.start_time.slice(11,16):""));

  const head=(placeLbl,withHeat)=>`<thead><tr><th style="width:42px">${placeLbl}</th><th style="width:52px">Нагр. №</th>
    ${anyName?'<th>Фамилия, имя</th>':''}${anyYear?'<th style="width:46px">Год рожд.</th>':''}${anyRank?'<th style="width:46px">Разряд</th>':''}${anyTeam?'<th>Команда</th>':''}${coachOn?'<th>Тренер</th>':''}
    ${withHeat?'<th style="width:70px">Забег</th>':''}${spl?splitDevs.map(d=>`<th style="width:70px">${esc(d)}</th>`).join(""):""}
    ${anySw?'<th>Секундомеры</th>':''}${anyAtt?'<th>Попытки</th>':''}<th style="width:78px">Результат</th>${anyDone?'<th style="width:56px">Вып. разряд</th>':''}${anyPts?'<th style="width:46px">Очки</th>':''}${chip?'<th>Чип</th>':''}<th style="width:46px">Прим.</th></tr></thead>`;
  // техника: на каждое место — все шесть попыток, чтобы был виден ход борьбы
  const techHead=withHeat=>`<thead><tr><th rowspan="2" style="width:42px">Место</th><th rowspan="2" style="width:52px">Нагр. №</th><th rowspan="2">Фамилия, имя</th><th rowspan="2" style="width:46px">Год рожд.</th>${anyRank?'<th rowspan="2" style="width:46px">Разряд</th>':''}${anyTeam?'<th rowspan="2">Команда</th>':''}${coachOn?'<th rowspan="2">Тренер</th>':''}<th colspan="6" class="sub" style="text-align:center">Попытки</th><th rowspan="2" style="width:84px">Лучший результат</th>${anyDone?'<th rowspan="2" style="width:56px">Вып. разряд</th>':''}</tr><tr>${[1,2,3,4,5,6].map(i=>`<th class="sub">Попытка ${i}</th>`).join("")}</tr></thead>`;
  const techTr=(x,place,res)=>`<tr${typeof place==="number"&&place>=1&&place<=3?` class="pl${place}"`:""}><td class="c"><b>${place}</b></td><td class="c">${esc(x.bib)}</td><td>${esc(x.name)}</td><td class="c">${esc(x.birth_year)}</td>${anyRank?`<td class="c">${esc(x.rank||"")}</td>`:''}${anyTeam?`<td>${esc(x.team)}</td>`:''}${coachOn?`<td>${esc(x.coach||"")}</td>`:''}${[0,1,2,3,4,5].map(i=>{const v=(x.attempts||[])[i]||""; return `<td class="c cellv${v&&res&&String(v).replace(",",".")===String(res).replace(",",".")?" bestv":""}">${esc(v)}</td>`;}).join("")}<td class="c"><b>${esc(res)}</b></td>${anyDone?`<td class="c">${esc(x.done_rank||"")}</td>`:''}</tr>`;
  const techOutRows=(list)=>list.map(x=>`<tr><td class="c">—</td><td class="c">${esc(x.bib)}</td><td>${esc(x.name)}</td><td class="c">${esc(x.birth_year)}</td>${anyRank?`<td class="c">${esc(x.rank||"")}</td>`:''}${anyTeam?`<td>${esc(x.team)}</td>`:''}${coachOn?`<td></td>`:''}<td class="c" colspan="6">${esc((x.attempts||[]).map(v=>v||"–").join(" · "))}</td><td class="c"><b>${esc(x.status||((x.attempts||[]).some(Boolean)?"NM":"DNS"))}</b></td>${anyDone?'<td></td>':''}</tr>`).join("");
  const tr=(x,place,withHeat,res,note)=>`<tr${typeof place==="number"&&place>=1&&place<=3?` class="pl${place}"`:""}><td class="c"><b>${place}</b></td><td class="c">${esc(x.bib)}</td>
    ${anyName?`<td>${esc(x.name)}${mem(x)}</td>`:''}${anyYear?`<td class="c">${esc(x.birth_year)}</td>`:''}${anyRank?`<td class="c">${esc(x.rank||"")}</td>`:''}${anyTeam?`<td>${esc(x.team)}</td>`:''}${coachOn?`<td>${esc(x.coach||"")}</td>`:''}
    ${withHeat?`<td class="c">${esc((x.wave||"").replace(/^Забег\s*/,""))}${x.place&&withHeat?` <small>(${x.place})</small>`:""}</td>`:''}
    ${spl?splitDevs.map(d=>`<td class="r">${esc(x.splits?.[d]||"")}</td>`).join(""):""}
    ${anySw?`<td class="c" style="font-size:11px">${esc(swTxt(x))}</td>`:''}${anyAtt?`<td class="c" style="font-size:11px">${esc(attTxt(x))}</td>`:''}<td class="r"><b>${esc(res)}</b></td>${anyDone?`<td class="c">${esc(x.done_rank||"")}</td>`:''}${anyPts?`<td class="c">${esc(fmtPts(x.points))}</td>`:''}${chip?`<td style="font-size:10px">${esc(x.chip)}</td>`:''}<td class="c">${note}</td></tr>`;
  const handNote=x=>man(x)&&!allManual?"р":"";
  // статус от секретаря (DNS/DNF/DQ/NM) важнее догадки по отметкам
  const outCode=x=>x.status||(x.last_point?"DNF":"DNS");
  const dnfRows=(list,withHeat)=>list.map(x=>tr(x,"—",withHeat,outCode(x),"")).join("");

  const teamsHtml=()=>(R.teams||[]).map(g=>{
    const cols=g.columns;
    return `<h2>Командный зачёт · ${esc(g.group)} <small>— сумма очков ${g.best} лучших участников команды в каждой категории</small></h2>
      <table><thead><tr><th style="width:52px">Место</th><th>Команда</th>${cols.map(c=>`<th style="width:90px">${esc(c)}</th>`).join("")}<th style="width:80px">Итого</th></tr></thead><tbody>
      ${g.rows.map(r=>`<tr class="${r.place<=3?"pl"+r.place:""}${tf&&r.team===tf?" mine":""}"><td class="c"><b>${r.place}</b></td><td>${esc(r.team)}</td>${cols.map(c=>`<td class="c">${esc(fmtPts(r.by[c]??""))}</td>`).join("")}<td class="c"><b>${esc(fmtPts(r.total))}</b></td></tr>`).join("")}
      </tbody></table>`;
  }).join("");
  let body="";
  if(mode==="teams"){
    body=teamsHtml();
  } else if(mode==="overall"){
    const groups={};
    R.finished.filter(byTeam).forEach(x=>(groups[gkey(x)]=groups[gkey(x)]||{f:[],d:[]}).f.push(x));
    if(dnf) R.on_course.concat(R.not_seen).filter(byTeam).forEach(x=>(groups[gkey(x)]=groups[gkey(x)]||{f:[],d:[]}).d.push(x));
    Object.keys(groups).sort().filter(k=>!gf||k===gf).forEach(k=>{
      const [d,c]=k.split("|"), g=groups[k]; g.f.sort((a,b)=>a.place_overall-b.place_overall);
      if(sf) renum(g.f);
      const pl=x=>sf?x._pl:x.place_overall;
      const th=g.f.concat(g.d).some(techX);
      if(th) anyTechShown=true;
      body+=`<h2>${esc(gtitle(d,c))} <small>— ${th?"техническая дисциплина, ":""}финишировали ${g.f.length}${g.d.length?`, без результата ${g.d.length}`:""}</small></h2>`
        +(th?`<table class="att tf">${techHead()}<tbody>${g.f.map(x=>techTr(x,pl(x),x.result)).join("")}${techOutRows(g.d)}</tbody></table>`
            :`<table>${head("Место",hasHeats)}<tbody>${g.f.map(x=>tr(x,pl(x),hasHeats,x.result,handNote(x))).join("")}${dnfRows(g.d,hasHeats)}</tbody></table>`);
    });
    if(!gf&&!tf&&!DIST) body+=teamsHtml();
  } else {
    const heats=hasHeats?ev.waves:[{name:"",category:"",distance:""}];
    heats.forEach(w=>{
      const f=R.finished.filter(x=>(x.wave||"")===w.name&&(!gf||gkey(x)===gf)&&byTeam(x)).sort((a,b)=>a.place-b.place);
      const d=dnf?R.on_course.concat(R.not_seen).filter(x=>(x.wave||"")===w.name&&(!gf||gkey(x)===gf)&&byTeam(x)):[];
      if(!f.length&&!d.length) return;
      const st=w.start_time?` · старт ${w.start_time.slice(11,19)}`:"";
      const tf_=f.filter(techX), rf=f.filter(x=>!techX(x)), td_=d.filter(techX), rd_=d.filter(x=>!techX(x));
      if(sf){ renum(tf_); renum(rf); }
      const pl=x=>sf?x._pl:x.place;
      const ttl=`<h2>${esc(w.name||"Общий старт")} <small>— ${esc(gtitle(w.distance,w.category))}${st}</small></h2>`;
      if(rf.length||rd_.length) body+=ttl+`<table>${head("Место",false)}<tbody>${rf.map(x=>tr(x,pl(x),false,x.result,handNote(x))).join("")}${dnfRows(rd_,false)}</tbody></table>`;
      if(tf_.length||td_.length){ anyTechShown=true; body+=(rf.length||rd_.length?"":ttl)+`<table class="att tf">${techHead()}<tbody>${tf_.map(x=>techTr(x,pl(x),x.result)).join("")}${techOutRows(td_)}</tbody></table>`; }
    });
  }
  if(!body) body='<div class="empty">Результатов пока нет</div>';
  const notes=[];
  if(allManual) notes.push("Хронометраж ручной, результаты округлены до 0,1 с в большую сторону.");
  else if(someManual) notes.push("«р» — результат по ручному хронометражу (округлён до 0,1 с в большую сторону).");
  if(tf&&mode!=="teams") notes.push(`Показаны только участники команды «${tf}». Места — общие по категории.`);
  if(mode==="overall"&&hasHeats) notes.push("Места определены по результатам всех забегов в категории; в скобках — место в забеге. Равный результат в разных забегах — одно место.");
  if(mode!=="teams"&&dnf&&(R.on_course.length||R.not_seen.length)){
    const codes=new Set(R.on_course.concat(R.not_seen).map(outCode));
    const more=[["DQ","дисквалифицирован"],["NM","нет результата"]].filter(([k])=>codes.has(k)).map(([k,v])=>`, ${k} — ${v}`).join("");
    notes.push(`DNS — не стартовал, DNF — не финишировал${more}.`);
  }

  if(anyDone&&mode!=="teams") notes.push(`«Вып. разряд» — по нормам ЕВСК${R.rank_source?" ("+R.rank_source.replace(/^Нормы ЕВСК[^—]*—\s*/,"")+")":""}: учтены пол, возраст в год соревнований, хронометраж, высота барьеров и масса снарядов; на соревнованиях этого статуса — не выше «${R.rank_cap||"1 р."}». Сила ветра не учитывается.`);
  if(anyTechShown) notes.push("Лучший результат определён по шести попыткам: X — неудачная попытка, «–» — пропуск.");
  if(sf&&mode!=="teams") notes.push(sf==="М"?"Показаны только мальчики, юноши, мужчины. Места пересчитаны среди показанных.":"Показаны только девочки, девушки, женщины. Места пересчитаны среди показанных.");
  return {land:anyTechShown, html:`
    ${BRAND}${ev.organizer?`<div class="org">${esc(ev.organizer)}</div>`:""}
    <h1>${mode==="teams"?"КОМАНДНЫЙ ЗАЧЁТ":"ПРОТОКОЛ РЕЗУЛЬТАТОВ"}</h1>${tf&&mode!=="teams"?`<div class="ev" style="margin-top:-4px">Команда: ${esc(tf)}</div>`:""}
    <div class="ev">${esc(ev.name)}</div>
    <div class="meta"><span>Дата: <b>${esc(dateRu(ev.date))||"—"}</b></span><span>Место проведения: <b>${esc(ev.place||"—")}</b></span><span>Начало: <b>${esc(startTxt||"—")}</b></span></div>
    ${stampHtml()}${body}
    <div class="tail">${notes.length?`<div class="note">${notes.map(esc).join("<br>")}</div>`:""}
    <div class="sign">
      <span>Главный судья</span><span class="u"></span><span class="nm">${esc(ev.chief_judge||"/____________________/")}</span>
      <span>Главный секретарь</span><span class="u"></span><span class="nm">${esc(ev.chief_secretary||"/____________________/")}</span>
    </div>
    <div class="foot"><span>Сформировано: ${new Date().toLocaleString("ru-RU")}</span><span>${esc(ev.name)}</span></div></div>`};
}
load();
</script>
</body>
</html>
