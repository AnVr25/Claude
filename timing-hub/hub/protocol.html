<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Протокол результатов</title>
<script>
/* Публичный режим — /r/<slug>/protocol на reg.fla65.ru: наружу открыт только /r/…, поэтому и ресурсы — из /r/assets/ */
window.PUB=/^\/r\/([A-Za-z0-9]{4,20})\/protocol\/?$/.exec(location.pathname);
window.ASSETS=window.PUB?"/r/assets/":"/assets/";
document.write('<link rel="stylesheet" href="'+window.ASSETS+'brand.css">');
</script>
<style>
/* Протокол — официальный документ: всегда светлый лист, чёрный текст, печать на A4. */
@page{size:A4;margin:12mm 12mm 14mm 12mm}
:root{color-scheme:light;
  --pr-bg:#E4E9F0;--pr-paper:#fff;--pr-ink:#0E1626;--pr-navy:#0B1D37;--pr-muted:#5E6B80;
  --pr-line:#CDD5E0;--pr-line-2:#B3BFCF;--pr-th:#EDF1F6;--pr-zebra:#F8FAFC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pr-bg);color:var(--pr-ink)}
body{font:12.5px/1.38 var(--body);-webkit-font-smoothing:antialiased}

/* Панель управления (только на экране) */
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:#0B1D37;color:#fff;font:14px/1.2 var(--body);border-bottom:3px solid var(--track);color-scheme:dark}
.bar .lg-ss{display:block;height:28px;width:auto;margin-right:4px}
.bar #barName{font:500 16px/1.2 var(--head);letter-spacing:.01em;max-width:28ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar select,.bar button,.bar a{font:inherit;min-height:34px;padding:6px 12px;border-radius:var(--r);border:1px solid #2C4166;background:#13284A;color:#fff;text-decoration:none;cursor:pointer}
.bar select{max-width:100%}
.bar a:hover,.bar select:hover{border-color:#9FB0C8}
.bar button.primary{background:var(--track);border-color:var(--track);color:#fff;font-weight:700}
.bar button.primary:hover{filter:brightness(1.08)}
.bar label{display:flex;gap:6px;align-items:center;color:#D5DEEA;cursor:pointer}
.bar input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--start)}
.bar .sp{flex:1}
.bar.off>:not(.lg-ss):not(.back):not(#barName){display:none}
:focus-visible{outline:2px solid var(--start);outline-offset:2px}

/* Лист A4 */
.sheet{width:210mm;min-height:297mm;margin:18px auto 28px;background:var(--pr-paper);padding:12mm 12mm 14mm;box-shadow:0 1px 2px rgba(11,29,55,.08),0 8px 28px rgba(11,29,55,.14);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}

/* Шапка: Сахалин → ФЛАСО → SakhStart */
.brandrow{position:relative;display:flex;align-items:center;gap:14px;padding-bottom:4mm;border-bottom:1.5px solid var(--pr-navy)}
.brandrow::after{content:"";position:absolute;left:0;bottom:-1.5px;width:30mm;height:3px;background:var(--track)}
.brandrow .logos{gap:14px}
.brandrow .lg-sakh{height:48px}
.brandrow .lg-flaso{height:40px}
.brandrow .lg-sep{background:var(--pr-line);height:34px}
.brandrow .lg-ss{display:block;margin-left:auto;height:40px;width:auto}
.org{margin-top:5mm;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--pr-muted)}
h1{margin:3mm 0 1mm;text-align:center;font:600 22px/1.15 var(--head);letter-spacing:.09em;color:var(--pr-navy)}
.org+h1{margin-top:1.5mm}
.ev{text-align:center;font:500 17px/1.25 var(--head);margin:0 0 4mm;color:var(--pr-ink)}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 14px;border-top:1px solid var(--pr-line-2);border-bottom:1px solid var(--pr-line-2);padding:2mm 0;margin-bottom:3mm;font-size:12px;color:var(--pr-muted)}
.meta b{color:var(--pr-ink);font-weight:700}

/* Группы и таблицы */
h2{margin:6mm 0 2mm;padding-left:8px;border-left:3px solid var(--track);font:600 15px/1.2 var(--head);letter-spacing:.01em;color:var(--pr-navy);break-after:avoid;page-break-after:avoid}
h2 small{font:400 12px var(--body);color:var(--pr-muted);letter-spacing:0}
table{width:100%;border-collapse:collapse;margin-bottom:2mm}
th,td{border:1px solid var(--pr-line);padding:3px 5px;text-align:left;vertical-align:baseline}
th{font:500 11px/1.2 var(--head);letter-spacing:.02em;text-align:center;vertical-align:bottom;background:var(--pr-th);color:var(--pr-navy);border-color:var(--pr-line-2);border-bottom:1.5px solid var(--pr-navy)}
/* стартовый протокол: шире колонка «Фамилия, имя» (ширины команды/тренера заданы в разметке) */
th[style="width:26%"]{width:21%!important}
th[style="width:20%"]{width:17%!important}
tbody tr:nth-child(even) td{background:var(--pr-zebra)}
td.c{text-align:center}
td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--head);font-size:13px}
td.r b{font-weight:600}
td small{color:var(--pr-muted)}
tbody td:first-child b{font:600 13px/1 var(--head)}
/* 1–3 места: мягкие золото / серебро / бронза */
tr[class^="pl"]>td:first-child b{display:inline-block;min-width:22px;padding:3px 4px 2px;border-radius:999px;text-align:center}
tr.pl1>td:first-child b{background:#C9A22733;box-shadow:inset 0 0 0 1px var(--gold);color:#5C4708}
tr.pl2>td:first-child b{background:#8E99A830;box-shadow:inset 0 0 0 1px var(--silver);color:#39414C}
tr.pl3>td:first-child b{background:#B873332E;box-shadow:inset 0 0 0 1px var(--bronze);color:#5B3613}
tr{break-inside:avoid;page-break-inside:avoid}
thead{display:table-header-group}
.note{margin-top:3mm;font-size:11px;color:var(--pr-muted)}

/* Подписи */
.sign{margin-top:10mm;display:grid;grid-template-columns:auto 1fr auto;column-gap:12px;row-gap:9mm;align-items:end;font-size:12.5px;break-inside:avoid;page-break-inside:avoid;max-width:150mm}
.sign .u{border-bottom:1px solid var(--pr-ink);height:1px;min-width:120px}
.sign .nm{min-width:150px}
.foot{margin-top:8mm;padding-top:2mm;border-top:1px solid var(--pr-line);font-size:10px;color:var(--pr-muted);display:flex;justify-content:space-between;gap:12px}
.empty{padding:30px;text-align:center;color:var(--pr-muted)}
.empty b{display:block;font:600 18px/1.25 var(--head);color:var(--pr-navy);margin-bottom:4px}
.empty a{color:var(--pr-navy)}
/* публичный режим: ссылка на страницу события, отметка «предварительные / официальные» */
.bar a.back{border-color:transparent;background:transparent;padding-left:4px;padding-right:4px;color:#D5DEEA}
.bar a.back:hover{color:#fff;border-color:transparent;text-decoration:underline}
.stamp{display:flex;align-items:center;justify-content:center;text-align:center;flex-wrap:wrap;gap:4px 8px;margin:-1mm 0 3mm;font:500 13px/1.3 var(--head);letter-spacing:.03em;color:var(--pr-navy)}
.stamp.pre{color:#B4330F}
.stamp.pre::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--start)}
.stamp.live::before{background:var(--track);animation:pulse 1.6s ease-out infinite}
.stamp small{font:400 12px var(--body);letter-spacing:0;color:var(--pr-muted)}
.stamp .po{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(231,30,37,.6)}70%{box-shadow:0 0 0 7px rgba(231,30,37,0)}100%{box-shadow:0 0 0 0 rgba(231,30,37,0)}}
@media (prefers-reduced-motion:reduce){.stamp.live::before{animation:none}}

@media print{
  :root{--pr-ink:#000;--pr-muted:#3B4452;--pr-line:#B9C3D0;--pr-line-2:#9AA7B8}
  html,body{background:#fff;color:#000}
  .bar{display:none}
  .stamp .so{display:none}.stamp .po{display:inline}.stamp::before{display:none}
  .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  .sheet,.meta b,.ev,td,.sign{color:#000}
  .brandrow,.org,h1,.ev,.meta{break-inside:avoid;page-break-inside:avoid}
  .brandrow+*{break-before:avoid}
  a{color:inherit;text-decoration:none}
}
@media (max-width:820px){.sheet{width:auto;min-height:0;margin:8px;padding:16px;overflow-x:auto}.brandrow,.brandrow .logos{gap:10px}.brandrow .lg-sakh{height:32px}.brandrow .lg-flaso{height:26px}.brandrow .lg-sep{height:24px}.brandrow .lg-ss{height:30px}}
</style>
</head>
<body>
<div class="bar">
  <img class="lg-ss" id="barLogo" alt="SakhStart">
  <b id="barName">Протокол</b>
  <select id="mode">
    <option value="overall">Итоговый: общий рейтинг по категориям</option>
    <option value="heats">По забегам</option>
    <option value="start">Стартовый протокол</option>
  </select>
  <select id="grp"><option value="">все дистанции и категории</option></select>
  <label id="chipBox"><input type="checkbox" id="showChip"> чипы</label>
  <label><input type="checkbox" id="showSplits"> отсечки</label>
  <label><input type="checkbox" id="showDnf" checked> не финишировали</label>
  <label><input type="checkbox" id="showCoach" checked> тренеры</label>
  <span class="sp"></span>
  <a id="csv">CSV</a>
  <button class="primary" onclick="window.print()">Печать / PDF</button>
</div>
<div class="sheet" id="sheet"><div class="empty">Загрузка…</div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eid=new URLSearchParams(location.search).get("event");
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let R=null, SL=null;
const kind=new URLSearchParams(location.search).get("kind");
["mode","grp","showChip","showSplits","showDnf","showCoach"].forEach(id=>{
  const el=$(id), saved=LS.get("protocol."+id,null);
  if(saved!==null){ if(el.type==="checkbox") el.checked=saved; else if(id!=="grp") el.value=saved; }
  el.onchange=()=>{LS.set("protocol."+id, el.type==="checkbox"?el.checked:el.value); render();};
});
const dateRu=d=>{ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${dd}.${m}.${y}`; };
const PUB=window.PUB, SLUG=PUB?PUB[1]:"", A=window.ASSETS||"/assets/";
$("barLogo").src=A+"sakhstart-dark.svg";
const BRAND=`<div class="brandrow"><span class="logos"><img class="lg-sakh" src="${A}sakhalin-dark.png" alt="Сахалин"><span class="lg-sep"></span><img class="lg-flaso" src="${A}flaso-light.png" alt="ФЛАСО"></span><img class="lg-ss" src="${A}sakhstart.svg" alt="SakhStart"></div>`;
if(PUB){
  // публичный протокол: без чипов, без CSV из закрытого API, со ссылкой на страницу события
  $("csv").remove(); $("chipBox").remove();
  const b=document.createElement("a"); b.className="back"; b.href="/r/"+SLUG; b.textContent="← к странице события"; $("barLogo").after(b);
}
const gkey=x=>(x.distance||"")+"|"+(x.category||"");
const gtitle=(dist,cat)=>[dist,cat].filter(Boolean).join(" · ")||"Все участники";

async function load(){
  if(PUB) return loadPublic();
  if(!eid){$("sheet").innerHTML='<div class="empty">Не выбрано соревнование. Откройте протокол из интерфейса.</div>';return;}
  const r=await fetch(`/api/events/${encodeURIComponent(eid)}/results`,{headers:{"X-Requested-With":"timing-hub"}});
  if(!r.ok){$("sheet").innerHTML='<div class="empty">Не удалось загрузить результаты</div>';return;}
  R=await r.json();
  document.title="Протокол — "+R.event.name;
  $("barName").textContent=R.event.name;
  $("csv").href=`/api/events/${R.event.id}/results.csv`;
  const keys=[...new Set(R.finished.concat(R.on_course,R.not_seen).map(gkey))].sort();
  const prev=LS.get("protocol.grp","");
  $("grp").innerHTML='<option value="">все дистанции и категории</option>'+keys.map(k=>{const [d,c]=k.split("|");return `<option value="${esc(k)}">${esc(gtitle(d,c))}</option>`;}).join("");
  if(keys.includes(prev)) $("grp").value=prev;
  if(kind==="start") $("mode").value="start";
  else if(kind==="results"&&$("mode").value==="start") $("mode").value="overall";
  render();
}
async function getPub(name){
  const r=await fetch(`/r/${SLUG}/${name}`,{cache:"no-store"});
  if(!r.ok){ r.text().catch(()=>{}); if(r.status===404||r.status===403) return null; throw new Error("HTTP "+r.status); }
  const d=await r.json();
  if(d.finished||d.not_seen){ ["finished","on_course","not_seen","devices"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; }); }
  if(d.event&&!Array.isArray(d.event.waves)) d.event.waves=[];
  return d;
}
function pubEmpty(title,text){
  $("sheet").innerHTML=`${BRAND}<div class="empty"><b>${esc(title)}</b>${esc(text)}<br><br><a href="/r/${esc(SLUG)}">← к странице события</a></div>`;
  document.querySelector(".bar").classList.add("off");
}
async function loadPublic(){
  try{ [R,SL]=await Promise.all([getPub("results.json"),getPub("startlist.json")]); }
  catch(e){ return pubEmpty("Не удалось загрузить протокол","Проверьте интернет и обновите страницу."); }
  if(!R&&!SL) return pubEmpty("Протокол ещё не опубликован","Он появится здесь, когда секретарь соревнований его опубликует.");
  const ev=(R||SL).event;
  document.title=(R?"Протокол — ":"Стартовый протокол — ")+ev.name;
  $("barName").textContent=ev.name;
  [...$("mode").options].forEach(o=>{ o.hidden=o.disabled=o.value==="start"?!SL:!R; });
  const keys=[...new Set(R?R.finished.concat(R.on_course,R.not_seen).map(gkey):SL.heats.map(gkey))].sort();
  const prev=LS.get("protocol.grp","");
  $("grp").innerHTML='<option value="">все дистанции и категории</option>'+keys.map(k=>{const [d,c]=k.split("|");return `<option value="${esc(k)}">${esc(gtitle(d,c))}</option>`;}).join("");
  if(keys.includes(prev)) $("grp").value=prev;
  if(kind==="start"&&SL||!R) $("mode").value="start";
  else if($("mode").value==="start"||$("mode").selectedIndex<0) $("mode").value="overall";
  render();
  setInterval(refresh,15000);
}
// предварительные результаты во время старта — обновляем каждые 15 с
const liveOn=()=>!!(PUB&&R&&R.final===false&&R.event&&R.event.status==="running");
async function refresh(){
  if(!liveOn()||document.hidden) return;
  try{ const d=await getPub("results.json"); if(!d) return; R=d; }catch(e){ return; }
  if($("mode").value==="start") return;
  const y=window.scrollY; render(); window.scrollTo(0,y);
}
function stampHtml(){
  if(!PUB||!R) return "";
  if(R.final) return '<div class="stamp">Официальные результаты</div>';
  const now=new Date(), live=liveOn();
  return `<div class="stamp pre${live?" live":""}"><span>Предварительные результаты${live?'<span class="so"> · обновляются автоматически</span>':""}<span class="po"> · по состоянию на ${now.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></span>${live?`<small class="so">обновлено в ${now.toLocaleTimeString("ru-RU")}</small>`:""}</div>`;
}
async function loadStart(){
  const r=await fetch(`/api/events/${encodeURIComponent(eid)}/startlist`,{headers:{"X-Requested-With":"timing-hub"}});
  SL=r.ok?await r.json():{heats:[],no_heat:[]};
  render();
}
function signs(ev){
  return `<div class="sign">
      <span>Главный судья</span><span class="u"></span><span class="nm">${esc(ev.chief_judge||"/____________________/")}</span>
      <span>Главный секретарь</span><span class="u"></span><span class="nm">${esc(ev.chief_secretary||"/____________________/")}</span>
    </div>`;
}
function headHtml(ev,title){
  const starts=ev.waves.filter(w=>w.start_time).map(w=>w.start_time.slice(11,16));
  const startTxt=ev.start_clock||(starts.length?starts[0]:(ev.start_time?ev.start_time.slice(11,16):""));
  return `${BRAND}${ev.organizer?`<div class="org">${esc(ev.organizer)}</div>`:""}
    <h1>${title}</h1>
    <div class="ev">${esc(ev.name)}</div>
    <div class="meta"><span>Дата: <b>${esc(dateRu(ev.date))||"—"}</b></span><span>Место проведения: <b>${esc(ev.place||"—")}</b></span><span>Начало: <b>${esc(startTxt||"—")}</b></span></div>`;
}
function renderStart(){
  if(!SL){ $("sheet").innerHTML='<div class="empty">Загрузка…</div>'; loadStart(); return; }
  const ev=(R||SL).event, gf=$("grp").value, coach=$("showCoach").checked;
  const anyCoach=SL.heats.some(h=>h.entries.some(e=>e.coach)), anySeed=SL.heats.some(h=>h.entries.some(e=>e.seed));
  const anyLane=SL.heats.some(h=>h.entries.some(e=>e.lane));
  let body="";
  SL.heats.forEach(h=>{
    if(gf&&gkey(h)!==gf) return;
    if(!h.entries.length) return;
    body+=`<h2>${esc(h.name)} <small>— ${esc(gtitle(h.distance,h.category))} · ${h.entries.length} уч.</small></h2>
      <table><thead><tr>${anyLane?'<th style="width:42px">Дор.</th>':""}<th style="width:52px">Нагр. №</th><th>Фамилия, имя</th><th style="width:46px">Год рожд.</th><th style="width:26%">Команда</th>
      ${coach&&anyCoach?'<th style="width:20%">Тренер</th>':""}${anySeed?'<th style="width:70px">Заявл. рез.</th>':""}<th style="width:70px">Результат</th></tr></thead><tbody>
      ${h.entries.map(e=>`<tr>${anyLane?`<td class="c"><b>${e.lane??""}</b></td>`:""}<td class="c">${esc(e.bib)}</td><td>${esc(e.name||"")}</td><td class="c">${esc(e.birth_year||"")}</td><td>${esc(e.team||"")}</td>
        ${coach&&anyCoach?`<td>${esc(e.coach||"")}</td>`:""}${anySeed?`<td class="r">${esc(e.seed||"")}</td>`:""}<td></td></tr>`).join("")}</tbody></table>`;
  });
  if(!body) body=PUB?'<div class="empty">Стартовый протокол пока пуст.</div>':'<div class="empty">Забегов пока нет — сформируйте их во вкладке «Регистрация».</div>';
  $("sheet").innerHTML=headHtml(ev,"СТАРТОВЫЙ ПРОТОКОЛ")+body+
    `<div class="note">Забеги сформированы по заявленным результатам. Колонка «Результат» — для записи судьями.</div>`+signs(ev)+
    `<div class="foot"><span>Сформировано: ${new Date().toLocaleString("ru-RU")}</span><span>${esc(ev.name)}</span></div>`;
}

function render(){
  if(!R){ if(PUB&&SL) renderStart(); return; }
  const ev=R.event, mode=$("mode").value, gf=$("grp").value;
  if(mode==="start") return renderStart();
  const coachOn=$("showCoach").checked&&R.finished.concat(R.not_seen).some(x=>x.coach);
  const chip=!PUB&&$("showChip").checked, spl=$("showSplits").checked, dnf=$("showDnf").checked;
  const fin=ev.finish_device, splitDevs=(R.devices||[]).filter(d=>d!==fin);
  const anyName=R.finished.concat(R.on_course,R.not_seen).some(x=>x.name), anyYear=R.finished.some(x=>x.birth_year)||R.not_seen.some(x=>x.birth_year);
  const anyTeam=R.finished.some(x=>x.team)||R.not_seen.some(x=>x.team), hasHeats=ev.waves.length>0;
  const man=x=>(x.manual||[]).includes(fin);
  const allManual=R.finished.length&&R.finished.every(man), someManual=R.finished.some(man);
  const starts=ev.waves.filter(w=>w.start_time).map(w=>w.start_time.slice(11,16));
  const startTxt=ev.start_clock||(starts.length?starts[0]:(ev.start_time?ev.start_time.slice(11,16):""));

  const head=(placeLbl,withHeat)=>`<thead><tr><th style="width:42px">${placeLbl}</th><th style="width:52px">Нагр. №</th>
    ${anyName?'<th>Фамилия, имя</th>':''}${anyYear?'<th style="width:46px">Год рожд.</th>':''}${anyTeam?'<th>Команда</th>':''}${coachOn?'<th>Тренер</th>':''}
    ${withHeat?'<th style="width:70px">Забег</th>':''}${spl?splitDevs.map(d=>`<th style="width:70px">${esc(d)}</th>`).join(""):""}
    <th style="width:78px">Результат</th>${chip?'<th>Чип</th>':''}<th style="width:46px">Прим.</th></tr></thead>`;
  const tr=(x,place,withHeat,res,note)=>`<tr${typeof place==="number"&&place>=1&&place<=3?` class="pl${place}"`:""}><td class="c"><b>${place}</b></td><td class="c">${esc(x.bib)}</td>
    ${anyName?`<td>${esc(x.name)}</td>`:''}${anyYear?`<td class="c">${esc(x.birth_year)}</td>`:''}${anyTeam?`<td>${esc(x.team)}</td>`:''}${coachOn?`<td>${esc(x.coach||"")}</td>`:''}
    ${withHeat?`<td class="c">${esc((x.wave||"").replace(/^Забег\s*/,""))}${x.place&&withHeat?` <small>(${x.place})</small>`:""}</td>`:''}
    ${spl?splitDevs.map(d=>`<td class="r">${esc(x.splits?.[d]||"")}</td>`).join(""):""}
    <td class="r"><b>${esc(res)}</b></td>${chip?`<td style="font-size:10px">${esc(x.chip)}</td>`:''}<td class="c">${note}</td></tr>`;
  const handNote=x=>man(x)&&!allManual?"р":"";
  // статус от секретаря (DNS/DNF/DQ/NM) важнее догадки по отметкам
  const outCode=x=>x.status||(x.last_point?"DNF":"DNS");
  const dnfRows=(list,withHeat)=>list.map(x=>tr(x,"—",withHeat,outCode(x),"")).join("");

  let body="";
  if(mode==="overall"){
    const groups={};
    R.finished.forEach(x=>(groups[gkey(x)]=groups[gkey(x)]||{f:[],d:[]}).f.push(x));
    if(dnf) R.on_course.concat(R.not_seen).forEach(x=>(groups[gkey(x)]=groups[gkey(x)]||{f:[],d:[]}).d.push(x));
    Object.keys(groups).sort().filter(k=>!gf||k===gf).forEach(k=>{
      const [d,c]=k.split("|"), g=groups[k]; g.f.sort((a,b)=>a.place_overall-b.place_overall);
      body+=`<h2>${esc(gtitle(d,c))} <small>— финишировали ${g.f.length}${g.d.length?`, без результата ${g.d.length}`:""}</small></h2>
        <table>${head("Место",hasHeats)}<tbody>${g.f.map(x=>tr(x,x.place_overall,hasHeats,x.result,handNote(x))).join("")}${dnfRows(g.d,hasHeats)}</tbody></table>`;
    });
  } else {
    const heats=hasHeats?ev.waves:[{name:"",category:"",distance:""}];
    heats.forEach(w=>{
      const f=R.finished.filter(x=>(x.wave||"")===w.name&&(!gf||gkey(x)===gf)).sort((a,b)=>a.place-b.place);
      const d=dnf?R.on_course.concat(R.not_seen).filter(x=>(x.wave||"")===w.name&&(!gf||gkey(x)===gf)):[];
      if(!f.length&&!d.length) return;
      const st=w.start_time?` · старт ${w.start_time.slice(11,19)}`:"";
      body+=`<h2>${esc(w.name||"Общий старт")} <small>— ${esc(gtitle(w.distance,w.category))}${st}</small></h2>
        <table>${head("Место",false)}<tbody>${f.map(x=>tr(x,x.place,false,x.result,handNote(x))).join("")}${dnfRows(d,false)}</tbody></table>`;
    });
  }
  if(!body) body='<div class="empty">Результатов пока нет</div>';
  const notes=[];
  if(allManual) notes.push("Хронометраж ручной, результаты округлены до 0,1 с в большую сторону.");
  else if(someManual) notes.push("«р» — результат по ручному хронометражу (округлён до 0,1 с в большую сторону).");
  if(mode==="overall"&&hasHeats) notes.push("Места определены по результатам всех забегов в категории; в скобках — место в забеге. Равный результат в разных забегах — одно место.");
  if(dnf&&(R.on_course.length||R.not_seen.length)){
    const codes=new Set(R.on_course.concat(R.not_seen).map(outCode));
    const more=[["DQ","дисквалифицирован"],["NM","нет результата"]].filter(([k])=>codes.has(k)).map(([k,v])=>`, ${k} — ${v}`).join("");
    notes.push(`DNS — не стартовал, DNF — не финишировал${more}.`);
  }

  $("sheet").innerHTML=`
    ${BRAND}${ev.organizer?`<div class="org">${esc(ev.organizer)}</div>`:""}
    <h1>ПРОТОКОЛ РЕЗУЛЬТАТОВ</h1>
    <div class="ev">${esc(ev.name)}</div>
    <div class="meta"><span>Дата: <b>${esc(dateRu(ev.date))||"—"}</b></span><span>Место проведения: <b>${esc(ev.place||"—")}</b></span><span>Начало: <b>${esc(startTxt||"—")}</b></span></div>
    ${stampHtml()}${body}
    ${notes.length?`<div class="note">${notes.map(esc).join("<br>")}</div>`:""}
    <div class="sign">
      <span>Главный судья</span><span class="u"></span><span class="nm">${esc(ev.chief_judge||"/____________________/")}</span>
      <span>Главный секретарь</span><span class="u"></span><span class="nm">${esc(ev.chief_secretary||"/____________________/")}</span>
    </div>
    <div class="foot"><span>Сформировано: ${new Date().toLocaleString("ru-RU")}</span><span>${esc(ev.name)}</span></div>`;
}
load();
</script>
</body>
</html>
